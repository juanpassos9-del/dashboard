name: Market News RSS Feed

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: market-news-rss-feed
  cancel-in-progress: true

jobs:
  collect-news:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Collector Dependencies
        run: python -m pip install requests feedparser supabase python-dotenv

      - name: Collect and Sync Public RSS News
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.SUPABASE }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE || secrets.SUPABASE_KEY || secrets.SUPABASE_SERVICE }}
        run: python execution/collect_market_news_feed.py
