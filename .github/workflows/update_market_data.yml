name: Update Market Data 24/7

on:
  schedule:
    # Roda de hora em hora (gratuito no GitHub)
    - cron: '0 * * * *'
  workflow_dispatch:
    # Permite que o usuário clique em um botão no GitHub para rodar manualmente a qualquer momento

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Cloud Updates
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.SUPABASE }}
        SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE || secrets.SUPABASE_KEY || secrets.SUPABASE_SERVICE }}
        GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python execution/run_cloud_updates.py
