name: LSE Realtime Quotes

on:
  schedule:
    # 24/7 a cada 5 minutos. O dashboard escolhe o dado valido mais recente.
    # GitHub Actions tem granularidade minima pratica de 5 minutos.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: lse-realtime-quotes
  cancel-in-progress: true

jobs:
  lse-realtime-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Minimal Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests supabase python-dotenv "lse-data>=0.14.0"

      - name: Sync LSE Realtime Quotes
        env:
          LSE_API_KEY: ${{ secrets.LSE_API_KEY || secrets.LONDON_STRATEGIC_EDGE_API_KEY || secrets.LONDON_STRATEGIC_EDGE_KEY || secrets.LSE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.SUPABASE }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE || secrets.SUPABASE_KEY || secrets.SUPABASE_SERVICE }}
        run: |
          python execution/lse_realtime_collector.py --once --ignore-market-window
