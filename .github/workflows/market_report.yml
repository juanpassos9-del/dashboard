name: Market Report Intradiario

on:
  schedule:
    # Horarios em UTC: 07:05, 13:05 e 19:05 em Sao Paulo (UTC-3)
    - cron: '5 10,16,22 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forcar geracao mesmo fora da janela?'
        required: false
        default: 'false'

jobs:
  market-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Generate and Sync Market Report
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        MARKET_REPORT_FORCE: ${{ github.event.inputs.force }}
      run: |
        python execution/run_market_report_update.py
